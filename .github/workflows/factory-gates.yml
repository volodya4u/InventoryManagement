name: Factory gates

# The factory's deterministic gates (ADR-0002), next to the build and the pr-evidence job in ci.yml. They are plain
# Node scripts with no dependencies, so the runner's preinstalled Node is enough.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: factory-gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cancel a run on main

jobs:
  factory-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the integrity check reads git log for the "Refs: PD-n" commits that approve a gate change

      # The committed report must be exactly what the check generates now, so a stale report cannot be merged.
      - name: Traceability report is fresh
        run: node scripts/check-traceability.mjs --check-fresh

      - name: Traceability chain
        run: node scripts/check-traceability.mjs

      - name: Acceptance methods exist
        run: node scripts/check-acceptance-methods.mjs --mode=existence

      # Every requirement must have its evidence: a test tagged "@trace <id>" or an open waiver in docs/qa/waivers/.
      - name: Acceptance artifacts exist
        run: node scripts/check-acceptance-methods.mjs --mode=artifact

      # ADR-0012. The accessibility and vision reports must describe the frontend as it is in this commit: a change under
      # frontend/src (a unit spec excepted) needs a fresh axe run and a fresh judging round in the same pull request, or
      # these fail as stale. Neither needs a browser or the JAR; they read the committed reports and the files they name.
      #   a11y:   pnpm run check:a11y            (builds nothing itself: needs the JAR and Chromium, writes docs/qa/a11y-report.json)
      #   vision: node scripts/check-vision.mjs capture, judge each screenshot, then node scripts/check-vision.mjs record <verdicts.json>
      # The vision verdicts are a model's judgement and not deterministic; this step checks that the report is complete,
      # current, and for the screenshots on disk, not that a judge ran.
      - name: Accessibility report is current and passes
        run: node scripts/check-a11y.mjs --check

      - name: Vision report is complete, current and for the screenshots on disk
        run: node scripts/check-vision.mjs

      # ADR-0002 follow-up. Every spec under openspec/specs and every active change under openspec/changes must pass the
      # OpenSpec format check. The CLI is not a repository dependency: it is downloaded from npm at run time, pinned to one
      # version (1.13.2, published 2026-09-23), with its telemetry off. Bump the pin by hand; Dependabot does not see it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # the CLI needs Node 20.19 or newer

      - name: OpenSpec specs and changes are valid
        env:
          OPENSPEC_TELEMETRY: "0"
        run: npx --yes @fission-ai/openspec@1.13.2 validate --all --strict --no-interactive

      - name: No open corrections
        run: node scripts/correct.mjs --check

      # Locked gate files (factory-lock.json): scripts and .githooks/* may only change through a commit that says
      # "Refs: PD-n" or re-seals the lock. Workflow files are the soft tier (a warning), because Dependabot bumps them.
      # Skipped for Dependabot pull requests, like pr-evidence.
      - name: Factory integrity
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
        run: node scripts/check-factory-integrity.mjs

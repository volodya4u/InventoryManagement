name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The agent hooks in .claude/ and the harness scripts only need the runner's preinstalled Node.
      - name: Agent harness self-test
        run: |
          node scripts/hooks-selftest.mjs
          node --test scripts/*.test.mjs

      # Also installs Node and pnpm into target/frontend-tooling and builds
      # the Angular frontend.
      - name: Build and test
        run: mvn -B -ntp verify

      # mvn verify fails on a failing test, but not when a whole test class silently never ran; this does.
      - name: Backend test-run guard
        run: node scripts/ci-test-guard.mjs backend

      # pnpm-lock.yaml is excluded in frontend/.prettierignore.
      - name: Frontend formatting
        working-directory: frontend
        run: |
          export PATH="$GITHUB_WORKSPACE/target/frontend-tooling/node:$PATH"
          pnpm exec prettier --check .

      # The default bash shell runs with `-o pipefail`, so a failing `ng test` still fails the step through the tee.
      - name: Frontend unit tests
        working-directory: frontend
        run: |
          export PATH="$GITHUB_WORKSPACE/target/frontend-tooling/node:$PATH"
          pnpm exec ng test --watch=false 2>&1 | tee "$GITHUB_WORKSPACE/target/frontend-test.log"

      # Like the backend guard: fail when Vitest exited 0 but ran fewer spec files than exist on disk.
      - name: Frontend test-run guard
        run: node scripts/ci-test-guard.mjs frontend target/frontend-test.log

  # Merge Dependabot's patch and minor updates once build-and-test has passed.
  # Docker image updates and minor Spring Boot parent updates are left for review.
  dependabot-auto-merge:
    needs: build-and-test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge patch and minor updates
        if: >-
          steps.meta.outputs.package-ecosystem != 'docker' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
            !contains(steps.meta.outputs.dependency-names, 'spring-boot-starter-parent')))
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

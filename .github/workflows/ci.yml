name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# GitHub runs an unspecified shell as `bash -e {0}`, which lets `cmd | tee` pass when `cmd` fails; `shell: bash` runs
# `bash --noprofile --norc -eo pipefail {0}` instead, so every `| tee` step below fails with its command
# (scripts/ci-workflow.test.mjs).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The agent hooks in .claude/ and the harness scripts only need the runner's preinstalled Node.
      - name: Agent harness self-test
        run: |
          node scripts/hooks-selftest.mjs
          node --test scripts/*.test.mjs

      # Also installs Node and pnpm into target/frontend-tooling and builds
      # the Angular frontend.
      - name: Build and test
        run: mvn -B -ntp verify

      # mvn verify fails on a failing test, but not when a whole test class silently never ran; this does.
      - name: Backend test-run guard
        run: node scripts/ci-test-guard.mjs backend

      # pnpm-lock.yaml is excluded in frontend/.prettierignore.
      - name: Frontend formatting
        working-directory: frontend
        run: |
          export PATH="$GITHUB_WORKSPACE/target/frontend-tooling/node:$PATH"
          pnpm exec prettier --check .

      # Save Vitest output for the test-run guard below; the workflow's pipefail still fails the step on a failing run.
      - name: Frontend unit tests
        working-directory: frontend
        run: |
          export PATH="$GITHUB_WORKSPACE/target/frontend-tooling/node:$PATH"
          pnpm exec ng test --watch=false --coverage 2>&1 | tee "$GITHUB_WORKSPACE/target/frontend-test.log"

      # Like the backend guard: fail when Vitest exited 0 but ran fewer spec files than exist on disk.
      - name: Frontend test-run guard
        run: node scripts/ci-test-guard.mjs frontend target/frontend-test.log

      # No coverage metric may drop below its committed baseline, on either side (ADR-0006). mvn verify wrote the JaCoCo
      # report and the step above the frontend summary; --require fails a side whose summary or baseline is missing.
      - name: Coverage ratchet
        run: |
          node scripts/jacoco-summary.mjs
          node scripts/check-coverage-ratchet.mjs --summary=target/site/jacoco/coverage-summary.json --baseline=quality/coverage-backend-baseline.json --label=backend --require
          node scripts/check-coverage-ratchet.mjs --summary=frontend/coverage/frontend/coverage-summary.json --baseline=quality/coverage-frontend-baseline.json --label=frontend --require

      # No eval dimension may score below its committed baseline (ADR-0007). The summary is derived from the committed
      # evals/record.json, so this needs no model call; --check fails when it is stale or the baseline is missing.
      - name: Eval ratchet
        run: |
          node scripts/eval-summary.mjs --check
          node scripts/check-eval-ratchet.mjs

      # Dynamic context: the angular-cli MCP server that .mcp.json starts for agents answers list_projects, and the
      # answer goes to the job summary. A broken server fails the build, Dependabot auto-merge included (a human
      # decision, docs/autonomy-log.md), instead of silently leaving agents on stale model memory.
      - name: Dynamic context (angular-cli MCP)
        run: node scripts/mcp-smoke.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # The executable JAR (Angular build included) that the browser tests below start.
      - name: Keep the application JAR for the browser tests
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: target/inventory-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 3

  # Browser tests (Playwright; OQ-8: Chromium, Firefox and WebKit) against the JAR that build-and-test built. A separate
  # job, so a browser failure is named as such. Dependabot auto-merge waits for it too: a Playwright, Spring Boot or
  # Angular update is only safe when the browser tests still pass on it.
  e2e:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The runner's preinstalled Node may be older than the one this pnpm version needs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      # The pnpm version is the one package.json pins (packageManager).
      - name: Install the test tooling
        run: |
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Browser tests
        run: pnpm run test:e2e

      - name: Keep the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # The evidence of the pull request, from the records the tools wrote, checked against its head commit
  # (scripts/pr-evidence.mjs): the reviewer's last verdict, a green dod run on this code, specs against their tests,
  # red -> green for a new spec's criteria, an autonomy-log row for significant work, a fresh evals record when the
  # reviewer/skills/AGENTS.md change, and a docs lookup for an import of a library new to main. The report goes to the
  # job summary, so the description need not repeat it by hand. Dependabot PRs skip it: CI is their checker, so they
  # carry no agent records.
  pr-evidence:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # main's history and the branch's commits, to diff the agent log and fingerprint the head
      # The workflow's `shell: bash` default enables pipefail, so tee cannot hide a failed evidence gate.
      - name: Evidence from the agent log and the specs
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch -q origin main
          node scripts/pr-evidence.mjs origin/main "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  # Merge Dependabot's patch and minor updates once build-and-test and the browser tests have passed.
  # Docker image updates and minor Spring Boot parent updates are left for review.
  dependabot-auto-merge:
    needs: [build-and-test, e2e]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge patch and minor updates
        if: >-
          steps.meta.outputs.package-ecosystem != 'docker' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
            !contains(steps.meta.outputs.dependency-names, 'spring-boot-starter-parent')))
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

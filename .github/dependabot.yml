version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    # Angular packages must share one version, so update them together.
    groups:
      angular:
        patterns:
          - "@angular/*"
      # @vitest/coverage-v8 pins vitest as an exact peer, and the coverage ratchet runs in CI (ADR-0006), so update them
      # together.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    # Angular majors need migrations: run `ng update` instead.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
  # The browser tests (e2e/). The frontend's own packages are the entry above.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

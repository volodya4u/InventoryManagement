version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    # Angular packages must share one version, so update them together.
    groups:
      angular:
        patterns:
          - "@angular/*"
    # Angular majors need migrations: run `ng update` instead.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
